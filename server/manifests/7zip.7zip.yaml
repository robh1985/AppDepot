# Converted from SyncScripts/7Zip.ps1: GitHub releases of ip7z/7zip, MSI verified against
# GitHub's SHA-256 digest (7-Zip installers are not Authenticode-signed).
id: 7zip.7zip
name: 7-Zip
publisher: Igor Pavlov
description: Free and open-source file archiver with a high compression ratio.
homepage: https://www.7-zip.org
license: LGPL-2.1
category: Utilities
tags: [archive, compression, zip]

sources:
  - type: github
    repo: ip7z/7zip
    asset_pattern: '^7z\d+-x64\.msi$'
  - type: web                       # fallback: 7-zip.org
    url: https://www.7-zip.org/download.html
    version_regex: 'Download 7-Zip (?P<version>\d+\.\d+)'
    download_url: https://www.7-zip.org/a/7z{version_nodots}-x64.msi

detection:
  display_name: '^7-Zip'
