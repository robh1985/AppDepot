# Converted from SyncScripts/Chrome.ps1: Google's fixed "latest" enterprise MSI (skipped when
# ETag/Last-Modified/size are unchanged). The MSI's ProductVersion is NOT the Chrome version,
# so the real version is read from the MSI's texts (version_regex), falling back to Google's
# version history API (newest Stable release fully rolled out on win64).
id: Google.Chrome
name: Google Chrome
publisher: Google LLC
description: Fast, secure web browser (enterprise MSI).
homepage: https://chromeenterprise.google
license: Proprietary
category: Browsers
tags: [browser]
schedule: "15 */6 * * *"

source:
  type: url
  url: https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi
  version_from: file
  version_regex: '(?<![\d.])(\d{2,3}\.\d+\.\d{3,5}\.\d+)'
  version_api:
    url: https://versionhistory.googleapis.com/v1/chrome/platforms/win64/channels/stable/versions/all/releases?filter=endtime=none
    path: 'releases[?fraction=1][max:version].version'

installer:
  type: msi
  signer: Google

detection:
  display_name: '^Google Chrome$'
