id: Mozilla.Firefox.ESR
name: Mozilla Firefox ESR
publisher: Mozilla
description: Free and open-source web browser (ESR channel, MSI, en-US, 64-bit).
homepage: https://www.mozilla.org/firefox/
license: MPL-2.0
category: Browsers
tags: [browser]

source:
  type: json
  url: https://product-details.mozilla.org/1.0/firefox_versions.json
  version_path: FIREFOX_ESR
