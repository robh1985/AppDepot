id: Mozilla.Firefox
name: Mozilla Firefox
publisher: Mozilla
description: Free and open-source web browser (MSI, en-US, 64-bit).
homepage: https://www.mozilla.org/firefox/
license: MPL-2.0
category: Browsers
tags: [browser]
schedule: "45 */6 * * *"

# Example of a JSON API source
source:
  type: json
  url: https://product-details.mozilla.org/1.0/firefox_versions.json
  version_path: LATEST_FIREFOX_VERSION
  download_url: https://download-installer.cdn.mozilla.net/pub/firefox/releases/{version}/win64/en-US/Firefox%20Setup%20{version}.msi

installer:
  type: msi
  architecture: x64
  # Disable Firefox's own updater; AppDepot/Intune keep it current.
  install_args: '/qn /norestart DESKTOP_SHORTCUT=false INSTALL_MAINTENANCE_SERVICE=false'

detection:
  display_name: '^Mozilla Firefox'
