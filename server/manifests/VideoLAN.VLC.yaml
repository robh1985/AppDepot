# Converted from SyncScripts/VLC.ps1: VideoLAN's "last" download folder gives the version;
# the MSI comes from the version's permanent folder. Signature: VideoLAN.
id: VideoLAN.VLC
name: VLC media player
publisher: VideoLAN
description: Free and open source cross-platform multimedia player.
homepage: https://www.videolan.org/vlc/
license: GPL-2.0
category: Multimedia
tags: [video, audio, player]

source:
  type: web
  url: https://download.videolan.org/pub/videolan/vlc/last/win64/
  version_regex: 'vlc-(?P<version>\d+\.\d+\.\d+)-win64\.msi'
  download_url: https://download.videolan.org/pub/videolan/vlc/{version}/win64/vlc-{version}-win64.msi

installer:
  type: msi
  signer: VideoLAN

detection:
  display_name: '^VLC media player'
