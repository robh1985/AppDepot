[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appdepot-server"
version = "1.4.1"
description = "Self-hosted application repository with automatic updates and Intune packaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=42",
    "olefile>=0.47",
    "tzlocal>=5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mssql = ["pyodbc>=5"]
test = ["pytest>=8"]

[project.scripts]
appdepot-server = "appdepot_server.cli:main"

[tool.setuptools]
packages = ["appdepot_server", "appdepot_server.sources", "appdepot_server.catalog"]

[tool.setuptools.package-dir]
# The bundled application manifests (server/manifests) ship inside the package so that
# "appdepot-server app add-catalog" can add them to any installation.
"appdepot_server.catalog" = "manifests"

[tool.setuptools.package-data]
"appdepot_server.catalog" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
